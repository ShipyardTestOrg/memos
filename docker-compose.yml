services:
  memos:
    # Shipyard: route all HTTP traffic for this environment to this service.
    labels:
      shipyard.route: '/'
    image: neosmemo/memos:stable
    container_name: memos
    environment:
      # On Kubernetes (Shipyard), the Service named "memos" makes k8s inject a
      # Docker-link-compat var MEMOS_PORT=tcp://<clusterIP>:5230, which shadows the
      # image's MEMOS_PORT=5230 — memos' viper config coerces that URL to 0 and
      # binds port 0, failing the health check. Pin the port explicitly; an explicit
      # pod-spec env var takes precedence over k8s service-link injection.
      MEMOS_PORT: "5230"
    ports:
      - "5230:5230"
    volumes:
      - memos-data:/var/opt/memos
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:5230/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  memos-data:
    labels:
      shipyard.deploy.disk.size: 2Gi
